<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CLAW — AI Code Agent</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark-dimmed.min.css" />
</head>
<body>

  <!-- ── Settings Modal ── -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-overlay" id="modal-overlay"></div>
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title"><span class="accent">⚙</span> Settings</span>
        <button id="close-settings" class="icon-btn">✕</button>
      </div>
      <div class="modal-body">
        <label class="field-label">GitHub Token <span class="badge-free">FREE</span></label>
        <div class="token-input-wrap">
          <input type="password" id="token-input" placeholder="ghp_..." autocomplete="off" spellcheck="false" />
          <button id="toggle-token" class="icon-btn small" title="Show/hide token">👁</button>
        </div>
        <p class="hint">
          Get a free token → <strong>github.com/settings/tokens</strong><br/>
          No scopes needed. Used only in your browser.
        </p>
        <label class="field-label" style="margin-top:16px">System Prompt</label>
        <textarea id="system-prompt-input" rows="4" placeholder="You are an expert coding assistant..."></textarea>
        <div class="modal-actions">
          <button id="save-settings" class="btn-primary">Save Settings</button>
          <button id="clear-history-btn" class="btn-danger">Clear All History</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Sidebar ── -->
  <aside id="sidebar">
    <div class="sidebar-top">
      <div class="logo">
        <div class="logo-icon">⚡</div>
        <div class="logo-text">CLAW<span class="logo-sub">agent</span></div>
      </div>
      <button id="new-chat-btn" class="new-chat-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Chat
      </button>
    </div>

    <div class="sidebar-section">
      <div class="section-label">MODEL</div>
      <div id="model-list" class="model-list"></div>
    </div>

    <div class="sidebar-section flex-1">
      <div class="section-label">HISTORY</div>
      <div id="history-list" class="history-list"></div>
    </div>

    <div class="sidebar-bottom">
      <button id="settings-btn" class="sidebar-action-btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Settings
      </button>
    </div>
  </aside>

  <!-- ── Main ── -->
  <main id="main">
    <header id="topbar">
      <button id="sidebar-toggle" class="icon-btn topbar-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div id="topbar-model" class="topbar-model"></div>
      <div class="topbar-right">
        <div id="status-indicator" class="status-indicator" title="Connection status">
          <span class="status-dot"></span>
          <span class="status-label">ready</span>
        </div>
      </div>
    </header>

    <div id="messages" class="messages">
      <div id="empty-state" class="empty-state">
        <div class="empty-glow"></div>
        <div class="empty-icon">⚡</div>
        <h2 class="empty-title">CLAW Code Agent</h2>
        <p class="empty-sub">Powered by GitHub Models · Zero backend · Zero cost</p>
        <div class="suggestions">
          <button class="chip" onclick="insertSuggestion('Write a Python FastAPI server with full CRUD endpoints and Pydantic models')">Python FastAPI CRUD</button>
          <button class="chip" onclick="insertSuggestion('Build a responsive React navbar with TypeScript and dark mode toggle')">React TypeScript Navbar</button>
          <button class="chip" onclick="insertSuggestion('Explain async/await in JavaScript with real-world examples')">Async/Await explained</button>
          <button class="chip" onclick="insertSuggestion('Write a binary search tree in JavaScript with insert, search, and delete')">Binary Search Tree JS</button>
          <button class="chip" onclick="insertSuggestion('Create a REST API client in Go with retry logic and error handling')">Go REST API Client</button>
          <button class="chip" onclick="insertSuggestion('Debug this and explain: async function bad() { return await await Promise.resolve(1) }')">Debug weird JS code</button>
        </div>
      </div>
    </div>

    <div id="input-area" class="input-area">
      <div class="input-box">
        <textarea
          id="user-input"
          placeholder="Ask anything… (Ctrl+Enter to send)"
          rows="1"
          spellcheck="true"
        ></textarea>
        <button id="send-btn" class="send-btn" title="Send (Ctrl+Enter)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22,2 15,22 11,13 2,9"/>
          </svg>
        </button>
      </div>
      <div class="input-footer">
        <span class="input-hint">Ctrl+Enter to send · Enter for newline</span>
        <span id="char-count" class="char-count"></span>
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.2.0/marked.min.js"></script>
  <script src="script.js?v=3"></script>
</body>
</html>
